name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# The tests read the checkout and nothing else.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Pinned to the commit behind v6.1.0, not the moving tag.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      # Full fixture matrix for the taboo guard, including the
      # check that every hook in settings.json is registered via
      # $CLAUDE_PROJECT_DIR (issue #2: a relative path fails open
      # after any cd).
      - name: Guard test matrix
        run: sh .claude/hooks/guard-taboos-test.sh

      # Lint and overview against a throwaway memory/ tree,
      # under the gawk the runner image installs as awk (5.2.1
      # on Ubuntu 24.04). The busybox job below covers the
      # other awk; mawk and BWK awk are run by hand.
      - name: Memory lint and overview tests
        run: sh tests/memory-tools-test.sh

      # doctor, log search and guard report against fakes in
      # a temp HOME and PATH; no network, no server.
      - name: bin tools tests
        run: sh tests/bin-tools-test.sh

      - name: Validate tracked JSON files
        run: |
          git ls-files '*.json' | while read -r f; do
            echo "checking $f"
            python3 -m json.tool "$f" > /dev/null
          done

      - name: Shell syntax check
        run: |
          for f in bin/* .claude/hooks/*.sh tests/*.sh; do
            echo "checking $f"
            sh -n "$f"
          done

      - name: ShellCheck (error severity)
        run: shellcheck -S error bin/* .claude/hooks/*.sh tests/*.sh

  # The team hub: Go code under hub/, tested with the Go
  # tools, cross-built for the platforms the install skill
  # downloads (the release workflow uploads the same four).
  hub:
    runs-on: ubuntu-latest
    # The store tests run on SQLite always and on this
    # throwaway PostgreSQL too (JOLITZ_HUB_TEST_PG below).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: hubtest
          POSTGRES_PASSWORD: hubtest
          POSTGRES_DB: hubtest
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hubtest"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: hub/go.mod
          cache-dependency-path: hub/go.sum
      - name: gofmt
        run: |
          cd hub
          test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: go vet and test (SQLite and PostgreSQL)
        run: |
          cd hub
          umask 077
          printf '%s\n' 'postgres://hubtest:hubtest@127.0.0.1:5432/hubtest?sslmode=disable' > "$RUNNER_TEMP/pg.dsn"
          go vet ./...
          JOLITZ_HUB_TEST_PG="$RUNNER_TEMP/pg.dsn" go test ./...
      - name: Cross-build
        run: |
          cd hub
          for t in linux/amd64 linux/arm64 freebsd/amd64 darwin/arm64; do
            GOOS=${t%/*} GOARCH=${t#*/} CGO_ENABLED=0 \
              go build -trimpath -o "/tmp/jolitz-hub_${t%/*}_${t#*/}" .
          done
          ls -l /tmp/jolitz-hub_*

  # The same scripts under busybox: ash as sh, busybox awk,
  # sed, tr and stat. Appliances and small hosts ship this
  # userland, and the guard must fail closed there, never
  # open.
  busybox:
    runs-on: ubuntu-latest
    container: alpine:3.20
    steps:
      - run: apk add --no-cache git jq
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Guard test matrix (busybox)
        run: sh .claude/hooks/guard-taboos-test.sh
      - name: Memory lint and overview tests (busybox)
        run: sh tests/memory-tools-test.sh
      - name: bin tools tests (busybox)
        run: sh tests/bin-tools-test.sh

  windows-git-bash:
    # Native Windows runs the hooks in Git Bash, as this job does.
    # A Windows path (C:\...) must hit the same blocks as on Unix,
    # and CRLF must not reach a shell script (.gitattributes).
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Tools
        run: |
          command -v jq || choco install jq --no-progress -y
          jq --version
          bash --version | head -1

      - name: Scripts checked out with LF
        run: |
          for f in bin/* .claude/hooks/*.sh tests/*.sh; do
            if grep -q "$(printf '\r')" "$f"; then
              echo "CRLF in $f"; exit 1
            fi
          done

      # The guard as Claude Code starts it, with Windows hook
      # input. The full matrix takes too long under Git Bash for
      # every pull request; windows-full-matrix runs it on main.
      - name: Guard smoke test
        run: sh tests/windows-smoke.sh

      - name: Memory lint and overview tests
        run: sh tests/memory-tools-test.sh

  windows-full-matrix:
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    timeout-minutes: 300
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Tools
        run: command -v jq || choco install jq --no-progress -y

      - name: Guard test matrix
        run: sh .claude/hooks/guard-taboos-test.sh

  macos-cleanup-scanner:
    # The skill runs the Command Line Tools Python.
    # This job uses that same /usr/bin/python3.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Scanner unit tests
        run: >-
          /usr/bin/python3 -m unittest discover -v
          -s .claude/skills/jolitz-macos-cleanup/scripts

      - name: Scanner smoke run
        run: |
          /usr/bin/python3 --version
          /usr/bin/python3 .claude/skills/jolitz-macos-cleanup/scripts/scan.py orphans > scan.json
          /usr/bin/python3 -m json.tool scan.json > /dev/null
