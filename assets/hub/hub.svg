<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660"
     width="1000" height="660" role="img"
     aria-labelledby="t d">
  <title id="t">jolitz team hub</title>
  <desc id="d">Three workstations push and pull their memory over
HTTPS with a token to the hub on a team host behind a reverse
proxy; a browser reads the hub's UI; git remains the alternative
for a team without a hub; the servers are reached only from the
workstations over SSH. The hub never runs a command.</desc>
  <style>
    :root {
      --bg: #fbfaf7;
      --fg: #1f2328;
      --muted: #6b7280;
      --line: #9aa0a6;
      --accent: #0b6e99;
      --ok: #2e7d32;
      --box: #ffffff;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #14171a;
        --fg: #e6e6e6;
        --muted: #9aa0a6;
        --line: #5f6a73;
        --accent: #5ab4e0;
        --ok: #7bc47f;
        --box: #1d2227;
      }
    }
    svg { background: var(--bg); }
    .bg { fill: var(--bg); }
    text {
      font-family: ui-monospace, "SF Mono", Menlo, Consolas,
        "Liberation Mono", "DejaVu Sans Mono", monospace;
      font-size: 13px;
      fill: var(--fg);
    }
    .h { font-size: 15px; font-weight: 600; }
    .s { font-size: 11.5px; fill: var(--muted); }
    .a { fill: var(--accent); }
    .ok { fill: var(--ok); }
    .box { fill: var(--box); stroke: var(--line); stroke-width: 1.2; }
    .hub { fill: var(--box); stroke: var(--accent); stroke-width: 1.6; }
    .inner { fill: none; stroke: var(--line); stroke-width: 1; }
    .ln { fill: none; stroke: var(--accent); stroke-width: 1.4; }
    .ssh { fill: none; stroke: var(--ok); stroke-width: 1.4; }
    .dot { fill: none; stroke: var(--muted); stroke-width: 1.2;
           stroke-dasharray: 4 4; }
    .arrow { fill: var(--accent); }
    .arrow-ok { fill: var(--ok); }
    .mid { text-anchor: middle; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" class="arrow"/>
    </marker>
    <marker id="ar-ok" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" class="arrow-ok"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1000" height="660"/>

  <!-- legend: git as the alternative -->
  <path class="dot" d="M700 20 H 740"/>
  <text class="s" x="750" y="24">git (team mode without a hub)</text>

  <!-- workstations -->
  <g id="ws">
    <rect class="box" x="40" y="48" width="190" height="78" rx="4"/>
    <text class="h" x="56" y="74">Linux</text>
    <text class="s" x="56" y="94">workstation · jolitz</text>
    <text class="s" x="56" y="112">memory/</text>

    <rect class="box" x="280" y="48" width="190" height="78" rx="4"/>
    <text class="h" x="296" y="74">macOS</text>
    <text class="s" x="296" y="94">workstation · jolitz</text>
    <text class="s" x="296" y="112">memory/</text>

    <rect class="box" x="520" y="48" width="190" height="78" rx="4"/>
    <text class="h" x="536" y="74">Windows · Git Bash</text>
    <text class="s" x="536" y="94">workstation · jolitz</text>
    <text class="s" x="536" y="112">memory/</text>
  </g>

  <!-- git: dotted links between the workstations -->
  <path class="dot" d="M230 87 H 280"/>
  <text class="s mid" x="255" y="106">git</text>
  <path class="dot" d="M470 87 H 520"/>
  <text class="s mid" x="495" y="106">git</text>

  <!-- push/pull: a bus under the workstations, one trunk to the proxy -->
  <path class="ln" d="M135 126 V 160 H 615 V 126"/>
  <path class="ln" d="M375 126 V 160"/>
  <path class="ln" d="M375 160 V 236" marker-start="url(#ar)" marker-end="url(#ar)"/>
  <text class="a" x="389" y="190">push / pull · HTTPS</text>
  <text class="a" x="389" y="206">Authorization: Bearer, from a token file</text>

  <!-- team host with proxy and hub -->
  <rect class="box" x="200" y="236" width="576" height="180" rx="4"/>
  <text class="s" x="216" y="256">team host · ops.example.com</text>

  <rect class="box" x="265" y="272" width="220" height="54" rx="3"/>
  <text class="h" x="281" y="295">reverse proxy</text>
  <text class="s" x="281" y="314">TLS · :443 → 127.0.0.1:7331</text>

  <path class="ln" d="M485 299 H 520" marker-end="url(#ar)"/>

  <rect class="hub" x="520" y="260" width="236" height="140" rx="4"/>
  <text class="h a" x="536" y="283">jolitz-hub</text>
  <text class="s" x="536" y="301">one binary · user jolitz-hub</text>
  <rect class="inner" x="536" y="314" width="62" height="30" rx="3"/>
  <text class="mid" x="567" y="334">API</text>
  <rect class="inner" x="606" y="314" width="62" height="30" rx="3"/>
  <text class="mid" x="637" y="334">UI</text>
  <rect class="inner" x="676" y="314" width="62" height="30" rx="3"/>
  <text class="mid" x="707" y="334">SQLite</text>
  <text class="s" x="536" y="366">/var/lib/jolitz-hub/hub.db</text>
  <text class="s" x="536" y="384">memory · sessions · claims</text>

  <!-- browser -->
  <rect class="box" x="800" y="272" width="160" height="68" rx="4"/>
  <text class="h" x="816" y="296">browser</text>
  <text class="s" x="816" y="314">fleet · hosts</text>
  <text class="s" x="816" y="330">timeline · presence</text>
  <path class="ln" d="M800 306 H 756" marker-end="url(#ar)"/>
  <text class="s" x="800" y="360">HTTPS · UI</text>
  <text class="s" x="800" y="376">token pasted once</text>

  <!-- the hub never runs a command -->
  <text class="s mid" x="488" y="446">the hub never runs a command</text>
  <text class="s mid" x="488" y="464">no SSH key, no connection to the servers</text>

  <!-- SSH: from the workstations, around the hub, to the servers -->
  <path class="ssh" d="M135 48 V 34 H 22 V 540 H 760 V 568" marker-end="url(#ar-ok)"/>
  <path class="ssh" d="M375 48 V 34"/>
  <path class="ssh" d="M615 48 V 34 H 375"/>
  <path class="ssh" d="M120 540 V 568" marker-end="url(#ar-ok)"/>
  <path class="ssh" d="M440 540 V 568" marker-end="url(#ar-ok)"/>
  <text class="ok" x="30" y="300">SSH</text>
  <text class="ok" x="30" y="532">SSH</text>

  <!-- servers -->
  <g id="servers">
    <rect class="box" x="40" y="568" width="160" height="50" rx="4"/>
    <text class="h" x="56" y="590">web1</text>
    <text class="s" x="56" y="608">Debian · nginx</text>

    <rect class="box" x="360" y="568" width="160" height="50" rx="4"/>
    <text class="h" x="376" y="590">db1</text>
    <text class="s" x="376" y="608">Ubuntu · postgresql</text>

    <rect class="box" x="680" y="568" width="160" height="50" rx="4"/>
    <text class="h" x="696" y="590">fw1</text>
    <text class="s" x="696" y="608">FreeBSD · pf</text>

    <text class="s" x="866" y="598">…</text>
  </g>

  <text class="s mid" x="500" y="646">servers: reached only from the workstations, over SSH</text>
</svg>
